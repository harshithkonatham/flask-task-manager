[project]
name = "todo-flask-app"
version = "0.2.0"
description = "A small to-do list web app built with Flask and SQLite"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Harshith Konatham" }]
dependencies = [
    "flask>=3.0",
    "flask-wtf>=1.2",
    "gunicorn>=23.0",
]

[dependency-groups]
dev = [
    "bandit>=1.9.4",
    "pip-audit>=2.10.1",
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["todo"]
branch = true

[tool.coverage.report]
fail_under = 90
show_missing = true
