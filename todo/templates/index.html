<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>To-Do List App</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 600px; margin: auto; padding: 20px; }
        ul { list-style-type: none; padding: 0; }
        li { margin: 10px 0; padding: 10px; background: #f0f0f0; border-radius: 5px; display: flex; justify-content: space-between; }
        form { margin-bottom: 20px; }
        input[type="text"] { width: 70%; padding: 8px; }
        button { padding: 8px 12px; background: #4CAF50; color: white; border: none; cursor: pointer; }
        .delete-btn { background: #f44336; }
    </style>
</head>
<body>
    <h1>My To-Do List</h1>
    <form method="POST">
        <input type="text" name="task" placeholder="Add a new task..." required>
        <button type="submit">Add</button>
    </form>
    <ul>
    {% for task in tasks %}
        <li>
            {{ task }}
            <form method="POST" style="display:inline;">
                <input type="hidden" name="delete" value="{{ loop.index0 }}">
                <button type="submit" class="delete-btn">Delete</button>
            </form>
        </li>
    {% endfor %}
</ul>
</body>
</html>
